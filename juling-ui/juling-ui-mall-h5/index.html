<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="theme-color" content="#0081ff" />
    <meta name="description" content="炬信矩灵 · 移动端订货商城" />
    <!-- iOS 添加到主屏 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="矩灵商城" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%VITE_APP_TITLE%</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f6f6;
        color: #999;
        font-size: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, sans-serif;
      }
      #app-loading .spinner {
        width: 28px;
        height: 28px;
        margin-right: 10px;
        border: 2px solid #e5e5e5;
        border-top-color: #0081ff;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="app-loading"><span class="spinner"></span>正在加载…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
