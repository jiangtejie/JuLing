worker_processes  1;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # WebSocket 升级支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log  logs/access.log main buffer=32k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    # 与后端 spring.servlet.multipart.max-request-size 60MB 对齐：
    # 原 50M 会让「9 张原图」这类大请求在 nginx 层就 413，用户看到的是网关错误页
    client_max_body_size 64M;

    # Gzip 压缩
    gzip  on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain text/css text/xml text/javascript 
    application/json application/javascript application/xml+rss 
    application/rss+xml image/svg+xml;

    # 统一代理头部（全局，location 可覆盖）
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 默认缓冲关闭（SSE/流式需要）
    proxy_buffering off;
    proxy_read_timeout 300s;

    server {
        listen       80;
        server_name  localhost;

        # # ===== New-API（根路径） =====
        # location / {
        #     proxy_pass http://127.0.0.1:3000;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection $connection_upgrade;
        # }

        # # ====== admin token面板 API 代理 ==========
        # location /api/usage/tokens {
        #     proxy_pass https://usage.clembot.uk/v1/usage/tokens;
        #     proxy_set_header Host usage.clembot.uk;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header CF-Access-Client-Id 51d5c0fdbac14f950d7e7cff1e7f4b0b.access;
        #     proxy_set_header CF-Access-Client-Secret fb43c31795ab8b4d8ec678c816e0272fa3d4e143da37d6f32a0811e38151cb22;
        #     proxy_set_header Authorization "Bearer jTCFiEj0BBPT09bgRTywFXbOBWju5UeJwrizVuERB6Y";
        #     proxy_ssl_server_name on;
        # }

    #      # ====== admin token面板 ==========
	#     location /admin/ {
    #     	alias E:/果冻看板/dist/;          # 注意使用正斜杠
    #     	try_files $uri $uri/ /admin/index.html;  # 支持前端路由
    #    		index index.html;
    #     }

    #      # ====== 锅司令智能体面板 ==========
	#    location ~ ^/yt(?!h5)/ {
    #     	alias D:/software/a_data/ideaPro/yt-agent-front/guosiling-brain/dist/;
    #     	try_files $uri $uri/ /yt/index.html;  # 支持前端路由
    #    		index index.html;
    #     }

        # ====== h5 静态资源：带内容哈希，可长缓存 ======
        location ^~ /h5/assets/ {
            root E:/yt-h5/dist/build;
            # 单个 Cache-Control，避免 expires 与 add_header 各写一条
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # ====== h5页面 ==========
        location /h5/ {
        	root E:/yt-h5/dist/build;
        	try_files $uri $uri/ /h5/index.html;
        	# 入口不缓存：发版后用户刷新即拿到新版本，避免"改了没生效"
        	add_header Cache-Control "no-cache";
        	index index.html;
        }

        # ====== 矩灵管理系统(vben antd 生产构建,子路径 /jl) ======
        location = /jl/index.html {
            alias D:/A_ERP/java17/JuLing/juling-ui/juling-ui-admin-vben/apps/web-antd/dist/index.html;
            add_header Cache-Control "no-cache";
        }

        location = /jl/logo.svg {
            alias D:/A_ERP/java17/JuLing/juling-ui/juling-ui-admin-vben/apps/web-antd/dist/logo.svg;
            expires 1h;
        }

        location /jl/ {
            alias D:/A_ERP/java17/JuLing/juling-ui/juling-ui-admin-vben/apps/web-antd/dist/;
            index index.html;
            try_files $uri $uri/ /jl/index.html;
            # 构建产物带内容哈希，可长缓存；入口 index.html 见上面的 no-cache
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 矩灵后端 API(48080)
        location /admin-api/ {
            proxy_pass http://127.0.0.1:48080;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # 矩灵 IM 实时通道(WebSocket,后端 context-path 为 /,端点是 /infra/ws)
        location /infra/ws {
            proxy_pass http://127.0.0.1:48080/infra/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;   # 长连接,避免被 60s 空闲超时断开
            proxy_send_timeout 3600s;
        }

        # # 文件预览 vendor/wasm 资源（供 file-viewer 渲染器加载）
        # location /vendor/ {
        #     alias D:/software/a_data/ideaPro/yt-agent-front/guosiling-brain/dist/vendor/;
        # }
        # location /wasm/ {
        #     alias D:/software/a_data/ideaPro/yt-agent-front/guosiling-brain/dist/wasm/;
        # }

        
                # # 锅司令 API 代理
        location /ytapi/ {
            proxy_pass http://127.0.0.1:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 流式响应支持
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            # 上传大图/弱网：把超时放宽，并让 nginx 边收边转发给后端，
            # 避免先在 nginx 落一份临时文件再转发（省一次磁盘往返）
            proxy_send_timeout 300s;
            client_body_timeout 300s;
            proxy_request_buffering off;
        }

        # # 锅司令 API 代理
        # location /api/v1/ {
        #     proxy_pass http://127.0.0.1:9898/api/v1/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;

        #     # SSE 流式响应支持
        #     proxy_buffering off;
        #     proxy_cache off;
        #     proxy_read_timeout 300s;
        # }

        # ====== 私域任务截图：禁止匿名直读 ======
        # /upload/task/** 是客户聊天/订单截图（含隐私），必须走后端鉴权接口
        # /ytapi/task-record/file/**（前端 getFileAccessUrl 已统一改写），
        # 历史记录走 /ytapi/upload/task/** 鉴权接口。
        location ^~ /upload/task/ {
            return 403;
        }

        # ====== 上传文件静态资源（仅公开目录） ==========
        location /upload/ {
            root D:/software/a_data/ideaPro/yth5-backend;
            # 常见静态资源缓存
            location ~* \.(jpg|jpeg|png|gif|svg|webp|ico|css|js|pdf|mp4|avi)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
        }

        # ====== WebSocket 代理：browser/connect ======
        location /browser/connect {
            proxy_pass http://[::1]:18790/browser/connect;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ====== 根路径兜底：可乐Claw 控制台 (18790) ======
        location / {
            proxy_pass http://[::1]:18790;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ====== 临时：飞书 AI 使用看板（WSL 产物，随机路径，勿外传） ======
        location = /bfyn444yi3b1 {
            alias //wsl.localhost/ubuntu/home/administrator/goclaw/goclaw-3.14.0/reports/feishu-ai-usage-dashboard.html;
            default_type text/html;
            charset utf-8;
            add_header Cache-Control "no-store";
        }

        location = /bfyn444yi3b1/ {
            return 302 /bfyn444yi3b1;
        }

        location = /bfyn444yi3b1/feishu-ai-usage-dashboard.html {
            alias //wsl.localhost/ubuntu/home/administrator/goclaw/goclaw-3.14.0/reports/feishu-ai-usage-dashboard.html;
            default_type text/html;
            charset utf-8;
            add_header Cache-Control "no-store";
        }

        # 错误页面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }

    # HTTPS 配置（如有证书，取消注释）
    # server {
    #     listen 443 ssl http2;
    #     server_name localhost;
    #     ssl_certificate     cert/cert.pem;
