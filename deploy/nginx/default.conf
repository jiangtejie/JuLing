# 与仓库 script/nginx/README.md 里归档的线上片段保持一致（那份是从裸机部署归档来的）
server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # ---------- 后台管理前端：/jl/ ----------
    # index.html 不缓存：保证部署后立刻拿到新的资源指纹
    location = /jl/index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
    # 带内容哈希的静态资源可长缓存
    location /jl/ {
        alias /usr/share/nginx/html/jl/;
        index index.html;
        try_files $uri $uri/ /jl/index.html;
    }

    # ---------- 门店订货 H5：/jl-mall/ ----------
    # H5 的 .env.production 里 VITE_API_BASE_URL 留空 = 同源，靠这里的反向代理
    location /jl-mall/ {
        alias /usr/share/nginx/html/jl-mall/;
        index index.html;
        try_files $uri $uri/ /jl-mall/index.html;
    }

    # ---------- 后端接口 ----------
    location /admin-api/ {
        proxy_pass http://backend:48080/admin-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /app-api/ {
        proxy_pass http://backend:48080/app-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 上传文件 ----------
    # backend 容器写入 uploads 卷，nginx 只读共享，静态文件不经过 Java 转发
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 7d;
    }

    # actuator 不对外暴露（容器网络内 healthcheck 直连 48080，不经过 nginx）
    location /actuator/ { return 404; }
}
