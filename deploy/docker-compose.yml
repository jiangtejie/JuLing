# JuLing-yate 生产部署编排
#
# 首次部署：
#   cp .env.example .env  然后编辑 .env
#   1) 编译后端：仓库根目录 mvn -T 1C clean package -DskipTests
#   2) 构建前端：juling-ui/juling-ui-admin-vben 下 pnpm install && pnpm run build:antd
#                juling-ui/juling-ui-mall-h5   下 pnpm install && pnpm run build:prod
#   3) 建库建表：docker compose --profile init run --rm db-init
#   4) 起服务：  docker compose up -d
#
# 数据库初始化特意**不放在 postgres 的 entrypoint**（不递归子目录、且只在卷为空时跑一次），
# 而是一个可重跑的一次性容器 db-init（脚本本身幂等）。
name: juling-yate

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # 只对本机开放，外部不要直连数据库
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 一次性初始化容器：用 profiles 隔离，不会随 up -d 自动启动
  db-init:
    image: postgres:15-alpine
    profiles: ["init"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
    volumes:
      - ../sql:/sql:ro
      - ./db-init.sh:/db-init.sh:ro
    entrypoint: ["sh", "/db-init.sh"]

  backend:
    build:
      # 上下文必须是仓库根目录：Dockerfile 要 COPY juling-server/target/juling-server.jar
      context: ..
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # 用环境变量覆盖，不必把密码写进 application-*.yaml
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - uploads:/juling-server/uploads    # 上传文件持久化，并与 nginx 共享
      - heaplogs:/juling-server/heap      # OOM 时的堆转储
    ports:
      - "127.0.0.1:${SERVER_PORT:-48080}:48080"   # 只给宿主机，外部一律走 nginx

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端产物直接挂载，不重复打包进镜像：发新版本只需重建前端 + 重启 nginx
      - ../juling-ui/juling-ui-admin-vben/apps/web-antd/dist:/usr/share/nginx/html/jl:ro
      - ../juling-ui/juling-ui-mall-h5/dist:/usr/share/nginx/html/jl-mall:ro
      - uploads:/usr/share/nginx/html/uploads:ro
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  pgdata:
  redisdata:
  uploads:
  heaplogs:
